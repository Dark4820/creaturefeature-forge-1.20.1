buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

mixin {
    add sourceSets.main, 'creaturefeature.refmap.json'
    config 'creaturefeature.mixins.json'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Always compile and run with Java 17 (Minecraft 1.20.1), whatever JAVA_HOME says.
// The Gradle daemon itself is pinned to Java 17 in gradle/gradle-daemon-jvm.properties.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// Development-only code and data (GameTests and their structure). Loaded by every dev run, never packed into the mod jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            // Mixins in the dev environment (official mappings): no refmap
            property 'mixin.env.disableRefMap', 'true'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.gametest
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // PORT: dev-only automatic render test (src/gametest/.../client/RenderSmokeTest): creates a flat world in
        // run-smoke, summons every creature in front of the camera and closes the game. Look for CF_RENDER_SMOKE_OK.
        clientRenderSmoke {
            parent runs.client
            workingDirectory project.file('run-smoke')
            property 'creaturefeature.renderSmoke', 'true'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // ForgeGradle adds the Forge maven and Maven Central by itself.
    // Local mod jars copied by the user from the modpack (development only, never packed in the mod jar)
    flatDir {
        dir 'libs'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mixin annotation processor (generates the refmap for the real game)
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // MixinExtras (the original uses @WrapOperation, @ModifyReturnValue, @WrapMethod...). Forge 47 does not ship it:
    // it is jar-in-jar'd into the mod jar.
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1'))
    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.4.1')) {
        jarJar.ranged(it, '[0.4.1,)')
    }
}

jarJar.enable()

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'creaturefeature.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

// The distributed jar is the jarJar one (it carries MixinExtras); reobfuscate it too
tasks.named('jarJar') { finalizedBy 'reobfJarJar' }
reobf { jarJar {} }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
