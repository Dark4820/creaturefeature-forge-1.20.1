modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="assets/creaturefeature/icon.png"
authors="${mod_authors}"
credits="Creature Feature was created by AtiredDev and Team Galena (MIT license). This is an unofficial Forge 1.20.1 port; all creatures, art, sounds and ideas are theirs."
displayURL="https://github.com/TerriblyBadCoder/creaturefeature"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
